name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check main process syntax
        run: node --check src/main.js

      - name: Check renderer modules syntax
        run: |
          for f in src/modules/*.js src/app.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Validate package.json
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.name || !p.version || !p.main) {
              console.error('package.json missing required fields');
              process.exit(1);
            }
            console.log('package.json OK');
          "
